                let currentBrowser = browser;
                if (currentBrowser === 'Base OS') {
                    if (currentDevice === 'Android') currentBrowser = 'Chrome';
                    else if (currentDevice === 'iPhone' || currentDevice === 'Mac' || currentDevice === 'iPad') currentBrowser = 'Safari';
                    else if (currentDevice === 'Windows') currentBrowser = 'Edge';
                }

                if(currentBrowser === 'None' && inapp === 'None') {
                    currentBrowser = (currentDevice === 'iPhone' || currentDevice === 'Mac' || currentDevice === 'iPad') ? 'Safari' : 'Chrome';
                }

                let isGeneric = Math.random() > 0.5;

                if (currentDevice === 'Android') {
                    let selBrand = document.querySelector('input[name="brand"]:checked').value;
                    let currentBrand = selBrand === 'Random' ? rand(['Samsung', 'Google', 'Motorola']) : selBrand;
                    
                    let availableModels = ANDROID_MODELS.filter(m => m.brand === currentBrand);
                    if (availableModels.length === 0) availableModels = ANDROID_MODELS.filter(m => m.brand === 'Samsung');
                    
                    let hw = rand(availableModels).model;
                    let androidOsVer = rand(ANDROID_VERSIONS); 
                    
                    if (currentBrowser === 'Chrome') {
                        const chromeV = rand(['152', '153', '154', '155']);
                        const chromeFull = isGeneric ? `${chromeV}.0.0.0` : `${chromeV}.0.${randInt(7500,8100)}.${randInt(10,150)}`;
                        if (isGeneric) {
                            ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeFull} Mobile Safari/537.36`;
                        } else {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeFull} Mobile Safari/537.36`;
                        }
                    } else if (currentBrowser === 'Edge') {
                        const edgeV = rand(['152', '153', '154', '155']) + '.0.0.0';
                        if (isGeneric) {
                            ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${edgeV} Mobile Safari/537.36 EdgA/${edgeV}`;
                        } else {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${edgeV} Mobile Safari/537.36 EdgA/${edgeV}`;
                        }
                    } else if (currentBrowser === 'Firefox') {
                        const ff = rand(['153', '154', '155', '156']) + '.0';
                        ua = `Mozilla/5.0 (Android ${androidOsVer}; Mobile; rv:${ff}) Gecko/${ff} Firefox/${ff}`;
                    } else if (currentBrowser === 'Opera') {
                        const opChrome = `${rand(['152','153','154','155'])}.0.${randInt(7500,8500)}.${randInt(10,99)}`;
                        const oprVer = `99.6.${randInt(2000,2999)}.${randInt(1000,3999)}`;
                        if (isGeneric) {
                            ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${opChrome} Mobile Safari/537.36 OPR/${oprVer}`;
                        } else {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${opChrome} Mobile Safari/537.36 OPR/${oprVer}`;
                        }
                    }

                } else if (currentDevice === 'iPhone' || currentDevice === 'iPad' || currentDevice === 'Mac') {
                    const appleVer = rand(APPLE_VERSIONS); 
                    const appleVerUnder = appleVer.replace('.', '_'); 
                    const safBuild = generateIOSBuild();

                    if (currentDevice === 'iPhone') {
                        const base = `iPhone; CPU iPhone OS ${appleVerUnder} like Mac OS X`;
                        if (currentBrowser === 'Safari') {
                            ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${appleVer} Mobile/${safBuild} Safari/604.1`;
                        } else if (currentBrowser === 'Chrome') {
                            ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${rand(['152','153','154','155'])}.0.${randInt(7500,8100)}.${randInt(10,150)} Mobile/${safBuild} Safari/604.1`;
                        }
                    } else if (currentDevice === 'iPad') {
                        const base = `iPad; CPU OS ${appleVerUnder} like Mac OS X`;
                        if (currentBrowser === 'Safari') {
                            ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${appleVer} Mobile/${safBuild} Safari/604.1`;
                        } else if (currentBrowser === 'Chrome') {
                            ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${rand(['152','153','154','155'])}.0.${randInt(7500,8100)}.${randInt(10,150)} Mobile/${safBuild} Safari/604.1`;
                        }
                    } else if (currentDevice === 'Mac') {
                        const base = `Macintosh; Intel Mac OS X 10_15_7`;
                        if (currentBrowser === 'Safari') {
                            ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${appleVer} Safari/605.1.15`;
                        } else if (currentBrowser === 'Chrome') {
                            ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${rand(['152','153','154','155'])}.0.0.0 Safari/537.36`;
                        }
                    }

                } else if (currentDevice === 'Windows') {
                    const base = `Windows NT 10.0; Win64; x64`;
                    const winVer = rand(['152', '153', '154', '155']) + '.0.0.0'; 
                    
                    if (currentBrowser === 'Chrome' || currentBrowser === 'Safari') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${winVer} Safari/537.36`;
                    } else if (currentBrowser === 'Edge') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${winVer} Safari/537.36 Edg/${winVer}`;
                    } else if (currentBrowser === 'Firefox') {
                        const ff = rand(['154', '155', '156', '157']) + '.0';
                        ua = `Mozilla/5.0 (${base}; rv:${ff}) Gecko/20100101 Firefox/${ff}`;
                    } else if (currentBrowser === 'Opera') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${winVer} Safari/537.36 OPR/136.0.0.0`;
                    }
                }

                if (inapp !== 'None') {
                    let appString = "";

                    if (currentDevice === 'Android') {
                        let selBrand = document.querySelector('input[name="brand"]:checked').value;
                        let currentBrand = selBrand === 'Random' ? rand(['Samsung', 'Google', 'Motorola']) : selBrand;
                        let availableModels = ANDROID_MODELS.filter(m => m.brand === currentBrand);
                        if (availableModels.length === 0) availableModels = ANDROID_MODELS.filter(m => m.brand === 'Samsung');
                        
                        let hw = rand(availableModels).model;
                        let androidOsVer = rand(ANDROID_VERSIONS);
                        let build = generateAndroidBuild(); 
                        
                        const cv = `${rand(['152','153','154','155'])}.0.${randInt(7500,8100)}.${randInt(10,150)}`;
                        ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${cv} Mobile Safari/537.36`;
                        
                        if (inapp === 'Facebook') {
                            appString = ` [FBAN/FB4A;FBAV/${APP_VERSIONS.Facebook_Android};]`;
                        } else if (inapp === 'Instagram') {
                            appString = ` Instagram ${APP_VERSIONS.Instagram} Android (${parseInt(androidOsVer)+20}/${androidOsVer}; 480dpi; 1080x2340; ${currentBrand.toLowerCase()}; ${hw}; o1q; exynos2100; ${geoUnder}; 450125432)`;
                        } else if (inapp === 'TikTok') {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${cv} Mobile Safari/537.36 TikTok/${APP_VERSIONS.TikTok} (Linux; U; Android ${androidOsVer}; ${geoUnder}; ${hw}; Build/${build}; Cronet/58.0.3029.0)`;
                            appString = "";
                        } else if (inapp === 'Twitter') {
                            appString = ` TwitterAndroid/${APP_VERSIONS.Twitter} (2910000-r-0)`;
                        } else if (inapp === 'LinkedIn') {
                            appString = ` LinkedInApp/${APP_VERSIONS.LinkedIn_Android} (Android ${androidOsVer})`;
                        } else if (inapp === 'Snapchat') {
                            appString = ` Snapchat/${APP_VERSIONS.Snapchat} (${hw}; Android ${androidOsVer}; Core/100)`;
                        } else if (inapp === 'Telegram') {
                            appString = ` Telegram/${APP_VERSIONS.Telegram} (Android ${androidOsVer}; ${hw})`;
                        }

                    } else if (currentDevice === 'iPhone' || currentDevice === 'iPad') {
                         const appleVer = rand(APPLE_VERSIONS);
                         const appleVerUnder = appleVer.replace('.', '_'); 
                         const isIpad = currentDevice === 'iPad';
                         const hw = isIpad ? 'iPad13,4' : rand(IPHONE_MODELS); 
                         const safBuild = generateIOSBuild();
                         
                         ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${appleVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild}`;
                         
                         if (inapp === 'Facebook') {
                            appString = ` [FBAN/FBIOS;FBAV/${APP_VERSIONS.Facebook_iOS};]`;
                         } else if (inapp === 'Instagram') {
                            appString = ` Instagram ${APP_VERSIONS.Instagram} (${hw}; iOS ${appleVerUnder}; ${geoUnder}; ${geoValue}; scale=3.00; 1170x2532; 443423985)`;
                         } else if (inapp === 'TikTok') {
                            appString = ` TikTok/${APP_VERSIONS.TikTok} (iPhone; iOS ${appleVerUnder}; ${geoUnder}; AppStore)`;
                         } else if (inapp === 'Twitter') {
                            appString = ` Twitter for iPhone/${APP_VERSIONS.Twitter}`;
                         } else if (inapp === 'LinkedIn') {
                            appString = ` LinkedInApp/${APP_VERSIONS.LinkedIn_iOS}`;
                         } else if (inapp === 'Snapchat') {
                            appString = ` Snapchat/${APP_VERSIONS.Snapchat} (iOS ${appleVer}; ${hw})`;
                         } else if (inapp === 'Telegram') {
                            appString = ` Telegram/${APP_VERSIONS.Telegram}`;
                         }
                    }

                    ua = ua + appString;
                }

                if(ua !== "") generatedUAs.push(ua);
            }

            renderOutput(generatedUAs);
        }

        function renderOutput(uaList) {
            const container = document.getElementById('outputContainer');
            const emptyState = document.getElementById('emptyState');
            const copyAllBtn = document.getElementById('copyAllBtn');
            const countDisplay = document.getElementById('resCount');

            container.innerHTML = '';
            countDisplay.innerText = uaList.length;

            if (uaList.length === 0) {
                emptyState.classList.remove('hidden');
                container.classList.add('hidden');
                copyAllBtn.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.classList.remove('hidden');
            copyAllBtn.classList.remove('hidden');

            uaList.forEach((ua, index) => {
                const div = document.createElement('div');
                div.className = 'ua-list-item opacity-0 animate-fade-up';
                div.style.animationDelay = `${index * 0.05}s`;
                
                const code = document.createElement('code');
                code.className = 'text-slate-300 font-mono text-[12px] md:text-[13px] break-all flex-grow font-medium leading-relaxed';
                code.textContent = ua;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'shrink-0 bg-[#020617] hover:bg-emerald-600 text-slate-300 hover:text-white border border-white/10 hover:border-emerald-400 text-xs font-bold py-2.5 px-5 rounded-xl transition-all flex items-center justify-center gap-2 w-full md:w-auto shadow-md hover:shadow-[0_0_15px_rgba(16,185,129,0.4)]';
                copyBtn.innerHTML = '<i class="ph-bold ph-copy text-sm"></i> Copy';
                
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(ua).then(() => {
                        const originalHtml = copyBtn.innerHTML;
                        copyBtn.innerHTML = '<i class="ph-bold ph-check text-emerald-400 text-sm"></i> Copied!';
                        copyBtn.classList.add('border-emerald-400', 'bg-emerald-500/10');
                        setTimeout(() => {
                            copyBtn.innerHTML = originalHtml;
                            copyBtn.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                        }, 2000);
                    });
                };

                div.appendChild(code);
                div.appendChild(copyBtn);
                container.appendChild(div);
            });
        }

        function copyAll() {
            const container = document.getElementById('outputContainer');
            const items = container.querySelectorAll('code');
            if (items.length === 0) return;
            
            const copyAllBtn = document.getElementById('copyAllBtn');
            const textToCopy = Array.from(items).map(code => code.textContent).join('\n');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalHtml = copyAllBtn.innerHTML;
                copyAllBtn.innerHTML = '<i class="ph-bold ph-check text-white text-lg"></i> All Copied!';
                copyAllBtn.classList.replace('from-slate-800', 'from-emerald-600');
                copyAllBtn.classList.replace('to-slate-700', 'to-teal-500');
                
                setTimeout(() => {
                    copyAllBtn.innerHTML = originalHtml;
                    copyAllBtn.classList.replace('from-emerald-600', 'from-slate-800');
                    copyAllBtn.classList.replace('to-teal-500', 'to-slate-700');
                }, 2000);
            });
        }
    </script>
</body>
</html>
