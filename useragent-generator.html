    <script>
        // --- DYNAMIC BROWSER LOGIC ---
        function updateUI() {
            const device = document.querySelector('input[name="device"]:checked').value;
            const brandSection = document.getElementById('brandSection');
            const inAppSection = document.getElementById('inAppSection');
            
            const lblAuto = document.getElementById('lbl_br_auto');
            const lblNone = document.getElementById('lbl_br_none');
            const lblChrome = document.getElementById('lbl_br_chrome');
            const lblFirefox = document.getElementById('lbl_br_firefox');
            const lblEdge = document.getElementById('lbl_br_edge');
            const lblSafari = document.getElementById('lbl_br_safari');
            const lblOpera = document.getElementById('lbl_br_opera');

            // Reset display
            [lblAuto, lblNone, lblChrome, lblFirefox, lblEdge, lblSafari, lblOpera].forEach(el => {
                if(el) el.style.display = 'none';
            });

            // Handle In-App Browser visibility for Win/Mac
            if (device === 'Windows' || device === 'Mac') {
                inAppSection.style.display = 'none';
                document.getElementById('app_none').checked = true; // Force disable
            } else {
                inAppSection.style.display = 'block';
            }

            if (device === 'Android') {
                brandSection.style.display = 'block';
                [lblNone, lblChrome, lblFirefox, lblEdge, lblOpera].forEach(el => el.style.display = 'inline-flex');
                if(document.getElementById('br_safari').checked || document.getElementById('br_auto').checked) {
                    document.getElementById('br_chrome').checked = true;
                }
            } else if (device === 'iPhone' || device === 'iPad' || device === 'Mac') {
                brandSection.style.display = 'none';
                [lblNone, lblSafari].forEach(el => el.style.display = 'inline-flex');
                document.getElementById('br_safari').checked = true;
            } else if (device === 'Windows') {
                brandSection.style.display = 'none';
                [lblNone, lblChrome, lblFirefox, lblEdge, lblOpera].forEach(el => el.style.display = 'inline-flex');
                if(document.getElementById('br_safari').checked || document.getElementById('br_auto').checked) {
                    document.getElementById('br_chrome').checked = true;
                }
            } else if (device === 'Random Mix') {
                brandSection.style.display = 'block';
                [lblAuto, lblNone, lblChrome, lblFirefox, lblEdge, lblSafari, lblOpera].forEach(el => el.style.display = 'inline-flex');
                document.getElementById('br_auto').checked = true;
            }
        }

        window.onload = updateUI;

        // Mutual Exclusivity
        const browserRadios = document.querySelectorAll('input[name="browser"]');
        const inappRadios = document.querySelectorAll('input[name="inapp"]');

        browserRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value !== 'None') {
                    document.getElementById('app_none').checked = true;
                }
            });
        });

        inappRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value !== 'None') {
                    document.getElementById('br_none').checked = true;
                }
            });
        });

        // --- ANDROID MODELS ---
        const ANDROID_MODELS = [
            { brand: 'Samsung', model: 'SM-S948B' },
            { brand: 'Samsung', model: 'SM-S938B' },
            { brand: 'Samsung', model: 'SM-S931B' },
            { brand: 'Samsung', model: 'SM-S928B' },
            { brand: 'Samsung', model: 'SM-S921B' },
            { brand: 'Samsung', model: 'SM-A032F' },
            { brand: 'Samsung', model: 'SM-F966B' },
            { brand: 'Samsung', model: 'SM-A556B' },
            { brand: 'Google', model: 'Pixel 10 Pro' },
            { brand: 'Google', model: 'Pixel 9 Pro XL' },
            { brand: 'Google', model: 'Pixel 8 Pro' },
            { brand: 'Google', model: 'Pixel 7 Pro' },
            { brand: 'Motorola', model: 'motorola edge 50 ultra' },
            { brand: 'Motorola', model: 'XT2403-2' }
        ];

        const IPHONE_MODELS = [
            'iPhone17,1', 'iPhone17,2', 'iPhone17,3', 'iPhone17,4',
            'iPhone16,1', 'iPhone16,2', 'iPhone15,4', 'iPhone15,5',
            'iPhone15,2', 'iPhone15,3', 'iPhone14,7', 'iPhone14,8'
        ];
        
        // OS & Browser Versions Data
        const ANDROID_VERSIONS = ['17', '16', '15', '14'];
        const IOS_OS_VERSIONS = ['15_6_1', '16_7_6', '17_5_1', '18_3_2'];

        const APP_VERSIONS = {
            'Facebook_Android': '580.0.0.51.74',
            'Facebook_iOS': '482.0.0.32.61',
            'Instagram': '350.0.0.17.76',
            'TikTok': '36.1.3',
            'Twitter': '10.60.0',
            'LinkedIn_Android': '4.1.941',
            'LinkedIn_iOS': '9.26.4471',
            'Snapchat': '13.5.0.37',
            'Telegram': '11.2.1'
        };

        const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Dynamic 3 previous + latest versions for all browsers
        function getChromeCore(isGeneric) {
            const v = rand(['152', '153', '154', '155']);
            return isGeneric ? `${v}.0.0.0` : `${v}.0.${randInt(7500,8100)}.${randInt(10,150)}`;
        }

        function getEdgeCore(isGeneric) {
            const v = rand(['152', '153', '154', '155']);
            return isGeneric ? `${v}.0.0.0` : `${v}.0.${randInt(4100,4300)}.${randInt(10,150)}`;
        }

        function getOperaCore(device, isGeneric) {
            const isMob = (device === 'Android' || device === 'iPhone' || device === 'iPad');
            const v = isMob ? rand(['82', '83', '84', '85']) : rand(['112', '113', '114', '115']);
            return isGeneric ? `${v}.0.0.0` : `${v}.0.${randInt(4000,4200)}.${randInt(10,150)}`;
        }

        function getFirefoxCore(device) {
            const isMob = (device === 'Android' || device === 'iPhone' || device === 'iPad');
            const v = isMob ? rand(['153', '154', '155', '156']) : rand(['154', '155', '156', '157']);
            return `${v}.0`;
        }

        function getSafariCore() {
            return rand(['15.6', '16.7', '17.5', '18.3.1']);
        }

        function generateIOSBuild() {
            const letters = "ABCDEFGHJ";
            const num1 = randInt(15, 25);
            const num2 = randInt(100, 999);
            const l = letters.charAt(Math.floor(Math.random() * letters.length));
            return `${num1}${l}${num2}`;
        }

        function generateAndroidBuild() {
            const prefixes = ['UP1A', 'TP1A', 'SP1A', 'UKQ1', 'RP1A', 'CP1A', 'BP1A', 'AP3A'];
            const year = randInt(24, 26);
            const month = String(randInt(1, 12)).padStart(2, '0');
            const day = String(randInt(1, 28)).padStart(2, '0');
            const revision = String(randInt(1, 999)).padStart(3, '0');
            return `${rand(prefixes)}.${year}${month}${day}.${revision}`;
        }

        function generateUAs() {
            const qty = parseInt(document.getElementById('uaQty').value) || 10;
            const deviceSelection = document.querySelector('input[name="device"]:checked').value;
            let browser = document.querySelector('input[name="browser"]:checked').value;
            const inapp = document.querySelector('input[name="inapp"]:checked').value;
            const geoValue = document.querySelector('input[name="country"]:checked').value;
            const geoUnder = geoValue.replace('-', '_'); 

            const generatedUAs = [];
            const mixDeviceTypes = ['Android', 'iPhone', 'Windows', 'Mac'];

            for(let i=0; i<qty; i++) {
                let ua = "";

                let currentDevice = deviceSelection;
                if (deviceSelection === 'Random Mix') {
                    currentDevice = rand(mixDeviceTypes);
                }

                let currentBrowser = browser;
                if (currentBrowser === 'Base OS') {
                    if (currentDevice === 'Android') currentBrowser = 'Chrome';
                    else if (currentDevice === 'iPhone' || currentDevice === 'Mac' || currentDevice === 'iPad') currentBrowser = 'Safari';
                    else if (currentDevice === 'Windows') currentBrowser = 'Edge';
                }

                if(currentBrowser === 'None' && inapp === 'None') {
                    currentBrowser = (currentDevice === 'iPhone' || currentDevice === 'Mac' || currentDevice === 'iPad') ? 'Safari' : 'Chrome';
                }

                let isGeneric = Math.random() > 0.5; // determines ending 0.0.0 or specific full build
                const chromeCore = getChromeCore(isGeneric);
                const edgeCore = getEdgeCore(isGeneric);
                const firefoxCore = getFirefoxCore(currentDevice);
                const operaCore = getOperaCore(currentDevice, isGeneric);
                const safariCore = getSafariCore();

                // ==========================================
                // BASE OS STRING CONSTRUCTION
                // ==========================================
                if (currentDevice === 'Android') {
                    let selBrand = document.querySelector('input[name="brand"]:checked').value;
                    let currentBrand = selBrand;
                    if (selBrand === 'Random' || deviceSelection === 'Random Mix') {
                        currentBrand = rand(['Samsung', 'Google', 'Motorola']);
                    }
                    
                    let availableModels = ANDROID_MODELS.filter(m => m.brand === currentBrand);
                    if (availableModels.length === 0) availableModels = ANDROID_MODELS.filter(m => m.brand === 'Samsung');
                    
                    let chosenModelObj = rand(availableModels);
                    let hw = chosenModelObj.model;
                    let androidOsVer = rand(ANDROID_VERSIONS); 
                    
                    if (currentBrowser === 'Chrome') {
                        if (isGeneric) {
                            ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Mobile Safari/537.36`;
                        } else {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Mobile Safari/537.36`;
                        }
                    } else if (currentBrowser === 'Edge') {
                        if (isGeneric) {
                            ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${getChromeCore(true)} Mobile Safari/537.36 EdgA/${edgeCore}`;
                        } else {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${getChromeCore(false)} Mobile Safari/537.36 EdgA/${edgeCore}`;
                        }
                    } else if (currentBrowser === 'Firefox') {
                        ua = `Mozilla/5.0 (Android ${androidOsVer}; Mobile; rv:${firefoxCore}) Gecko/${firefoxCore} Firefox/${firefoxCore}`;
                    } else if (currentBrowser === 'Opera') {
                        ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${getChromeCore(true)} Mobile Safari/537.36 OPR/${operaCore}`;
                    } else if (currentBrowser === 'Safari') {
                        ua = `Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Mobile Safari/537.36`;
                    }

                } else if (currentDevice === 'iPhone') {
                    const osVerRaw = rand(IOS_OS_VERSIONS); 
                    const osVerUnder = osVerRaw; 
                    const base = `iPhone; CPU iPhone OS ${osVerUnder} like Mac OS X`;
                    const safBuild = generateIOSBuild();

                    if (currentBrowser === 'Safari') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${safariCore} Mobile/${safBuild} Safari/604.1`;
                    } else if (currentBrowser === 'Chrome') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${chromeCore} Mobile/${safBuild} Safari/604.1`;
                    } else if (currentBrowser === 'Edge') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${safariCore} Mobile/${safBuild} Safari/604.1 EdgiOS/${edgeCore}`;
                    } else if (currentBrowser === 'Firefox') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) FxiOS/${firefoxCore} Mobile/${safBuild} Safari/605.1.15`;
                    } else if (currentBrowser === 'Opera') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) OPiOS/${operaCore} Mobile/${safBuild} Safari/605.1.15`;
                    }

                } else if (currentDevice === 'iPad') {
                    const osVerRaw = rand(IOS_OS_VERSIONS); 
                    const osVerUnder = osVerRaw; 
                    const base = `iPad; CPU OS ${osVerUnder} like Mac OS X`;
                    const safBuild = generateIOSBuild();

                    if (currentBrowser === 'Safari') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${safariCore} Mobile/${safBuild} Safari/604.1`;
                    } else if (currentBrowser === 'Chrome') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${chromeCore} Mobile/${safBuild} Safari/604.1`;
                    } else {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${safariCore} Mobile/${safBuild} Safari/604.1`;
                    }

                } else if (currentDevice === 'Windows') {
                    const base = `Windows NT 10.0; Win64; x64`;
                    
                    if (currentBrowser === 'Chrome' || currentBrowser === 'Safari') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Safari/537.36`;
                    } else if (currentBrowser === 'Edge') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Safari/537.36 Edg/${edgeCore}`;
                    } else if (currentBrowser === 'Firefox') {
                        ua = `Mozilla/5.0 (${base}; rv:${firefoxCore}) Gecko/20100101 Firefox/${firefoxCore}`;
                    } else if (currentBrowser === 'Opera') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Safari/537.36 OPR/${operaCore}`;
                    }

                } else if (currentDevice === 'Mac') {
                    const base = `Macintosh; Intel Mac OS X 10_15_7`;
                    
                    if (currentBrowser === 'Safari') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${safariCore} Safari/605.1.15`;
                    } else if (currentBrowser === 'Chrome' || currentBrowser === 'Edge') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Safari/537.36`;
                        if(currentBrowser === 'Edge') ua += ` Edg/${edgeCore}`;
                    } else if (currentBrowser === 'Firefox') {
                        ua = `Mozilla/5.0 (${base}; rv:${firefoxCore}) Gecko/20100101 Firefox/${firefoxCore}`;
                    } else if (currentBrowser === 'Opera') {
                        ua = `Mozilla/5.0 (${base}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeCore} Safari/537.36 OPR/${operaCore}`;
                    }
                }

                // ==========================================
                // IN-APP BROWSER STRINGS
                // ==========================================
                if (inapp !== 'None') {
                    let appString = "";

                    if (currentDevice === 'Android') {
                        let selBrand = document.querySelector('input[name="brand"]:checked').value;
                        let currentBrand = selBrand;
                        if (selBrand === 'Random' || deviceSelection === 'Random Mix') {
                            currentBrand = rand(['Samsung', 'Google', 'Motorola']);
                        }
                        let availableModels = ANDROID_MODELS.filter(m => m.brand === currentBrand);
                        if (availableModels.length === 0) availableModels = ANDROID_MODELS.filter(m => m.brand === 'Samsung');
                        
                        let chosenModelObj = rand(availableModels);
                        let hw = chosenModelObj.model;
                        let androidOsVer = rand(ANDROID_VERSIONS);
                        let build = generateAndroidBuild(); 
                        
                        // In-App always includes Model and Build Number
                        ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${getChromeCore(false)} Mobile Safari/537.36`;
                        
                        if (inapp === 'Facebook') {
                            appString = ` [FBAN/FB4A;FBAV/${APP_VERSIONS.Facebook_Android};]`;
                        } else if (inapp === 'Instagram') {
                            const apiLvl = parseInt(androidOsVer) + 20; 
                            appString = ` Instagram ${APP_VERSIONS.Instagram} Android (${apiLvl}/${androidOsVer}; 480dpi; 1080x2340; ${currentBrand.toLowerCase()}; ${hw}; o1q; exynos2100; en_US; 450125432)`;
                        } else if (inapp === 'TikTok') {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${getChromeCore(false)} Mobile Safari/537.36 TikTok/${APP_VERSIONS.TikTok} (Linux; U; Android ${androidOsVer}; en_US; ${hw}; Build/${build}; Cronet/58.0.3029.0)`;
                            appString = "";
                        } else if (inapp === 'Twitter') {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${getChromeCore(false)} Mobile Safari/537.36 TwitterAndroid/${APP_VERSIONS.Twitter} (2910000-r-0)`;
                            appString = "";
                        } else if (inapp === 'LinkedIn') {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${getChromeCore(false)} Mobile Safari/537.36 LinkedInApp/${APP_VERSIONS.LinkedIn_Android} (Android ${androidOsVer})`;
                            appString = "";
                        } else if (inapp === 'Snapchat') {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw} Build/${build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${getChromeCore(false)} Mobile Safari/537.36 Snapchat/${APP_VERSIONS.Snapchat} (${hw}; Android ${androidOsVer}; Core/100)`;
                            appString = "";
                        } else if (inapp === 'Telegram') {
                            ua = `Mozilla/5.0 (Linux; Android ${androidOsVer}; ${hw}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${getChromeCore(false)} Mobile Safari/537.36 Telegram/${APP_VERSIONS.Telegram} (Android ${androidOsVer}; ${hw})`;
                            appString = "";
                        }

                    } else if (currentDevice === 'iPhone' || currentDevice === 'iPad') {
                         const isIpad = currentDevice === 'iPad';
                         const osVerRaw = rand(IOS_OS_VERSIONS);
                         const osVerUnder = osVerRaw;
                         const osVerDot = osVerRaw.replace(/_/g, '.');
                         const hw = isIpad ? 'iPad' + randInt(13, 16) + ',' + randInt(1, 8) : rand(IPHONE_MODELS); 
                         const safBuild = generateIOSBuild();
                         
                         ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${osVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild}`;
                         
                         if (inapp === 'Facebook') {
                            appString = ` [FBAN/FBIOS;FBAV/${APP_VERSIONS.Facebook_iOS};]`;
                         } else if (inapp === 'Instagram') {
                            appString = ` Instagram ${APP_VERSIONS.Instagram} (iPhone14,5; iOS ${osVerUnder}; en_US; en-US; scale=3.00; 1170x2532; 443423985)`;
                         } else if (inapp === 'TikTok') {
                            ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${osVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild} TikTok/${APP_VERSIONS.TikTok} (iOS ${osVerDot}; ${geoUnder})`;
                            appString = "";
                         } else if (inapp === 'Twitter') {
                            ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${osVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild} Twitter for iPhone/${APP_VERSIONS.Twitter}`;
                            appString = "";
                         } else if (inapp === 'LinkedIn') {
                            ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${osVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild} LinkedInApp/${APP_VERSIONS.LinkedIn_iOS}`;
                            appString = "";
                         } else if (inapp === 'Snapchat') {
                            ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${osVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild} Snapchat/${APP_VERSIONS.Snapchat} (iOS ${osVerDot}; ${hw})`;
                            appString = "";
                         } else if (inapp === 'Telegram') {
                            ua = `Mozilla/5.0 (${isIpad ? 'iPad' : 'iPhone'}; CPU ${isIpad?'OS':'iPhone OS'} ${osVerUnder} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/${safBuild} Telegram/${APP_VERSIONS.Telegram}`;
                            appString = "";
                         }
                    }

                    ua = ua + appString;
                }

                if(ua !== "") {
                    generatedUAs.push(ua);
                }
            }

            renderOutput(generatedUAs);
        }

        function renderOutput(uaList) {
            const container = document.getElementById('outputContainer');
            const emptyState = document.getElementById('emptyState');
            const copyAllBtn = document.getElementById('copyAllBtn');
            const countDisplay = document.getElementById('resCount');

            container.innerHTML = '';
            countDisplay.innerText = uaList.length;

            if (uaList.length === 0) {
                emptyState.classList.remove('hidden');
                container.classList.add('hidden');
                copyAllBtn.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.classList.remove('hidden');
            copyAllBtn.classList.remove('hidden');

            uaList.forEach((ua) => {
                const div = document.createElement('div');
                div.className = 'ua-list-item';
                
                const code = document.createElement('code');
                code.className = 'text-slate-300 font-mono text-[12px] md:text-[13px] break-all flex-grow font-semibold';
                code.textContent = ua;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'shrink-0 bg-[#020617] hover:bg-emerald-600 text-slate-300 hover:text-white border border-white/10 hover:border-emerald-500 text-xs font-bold py-2.5 px-5 rounded-xl transition-all flex items-center justify-center gap-2 w-full md:w-auto shadow-md';
                copyBtn.innerHTML = '<i class="ph-bold ph-copy text-sm"></i> Copy';
                
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(ua).then(() => {
                        const originalHtml = copyBtn.innerHTML;
                        copyBtn.innerHTML = '<i class="ph-bold ph-check text-emerald-400 text-sm"></i> Copied!';
                        copyBtn.classList.add('border-emerald-500');
                        setTimeout(() => {
                            copyBtn.innerHTML = originalHtml;
                            copyBtn.classList.remove('border-emerald-500');
                        }, 2000);
                    });
                };

                div.appendChild(code);
                div.appendChild(copyBtn);
                container.appendChild(div);
            });
        }

        function copyAll() {
            const container = document.getElementById('outputContainer');
            const items = container.querySelectorAll('code');
            if (items.length === 0) return;
            
            const copyAllBtn = document.getElementById('copyAllBtn');
            const textToCopy = Array.from(items).map(code => code.textContent).join('\n');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalHtml = copyAllBtn.innerHTML;
                copyAllBtn.innerHTML = '<i class="ph-bold ph-check text-white text-lg"></i> All Copied!';
                copyAllBtn.classList.replace('bg-slate-800', 'bg-emerald-600');
                
                setTimeout(() => {
                    copyAllBtn.innerHTML = originalHtml;
                    copyAllBtn.classList.replace('bg-emerald-600', 'bg-slate-800');
                }, 2000);
            });
        }
    </script>
</body>
</html>
